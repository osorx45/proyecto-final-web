# Nginx del contenedor Frontend: solo entrega los archivos compilados de React.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router maneja las rutas (/pedidos, /generar...). Si la ruta no es
    # un archivo real, se entrega index.html y React decide qué pantalla mostrar.
    location / {
        try_files $uri /index.html;
    }

    # Los archivos de /assets llevan un código único en el nombre:
    # el navegador puede guardarlos sin riesgo.
    location /assets/ {
        expires 30d;
    }
}
